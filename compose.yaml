name: smca
services:
  app:
    build: .
    expose:
      - "8501"
    volumes:
      - smca_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/smca-control.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs/smca-control.crt:/etc/nginx/certs/smca-control.crt:ro,Z
      - ./certs/smca-control.key:/etc/nginx/certs/smca-control.key:ro,Z
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
volumes:
  smca_data:
